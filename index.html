<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>올림포스 지문 암기장</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=Noto+Serif+KR:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: #F5F1E7;
    --card: #FFFDF8;
    --line: #DCD3BE;
    --ink: #1F2A3C;
    --ink-soft: #5B6472;
    --brick: #9A3324;
    --brick-soft: #C15A3F;
    --pine: #2F6F62;
    --pine-soft: #E4EFEC;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Noto Sans KR', sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .app{ display:flex; min-height:100vh; }

  /* ---- 좌측 목차 탭 ---- */
  .rail{
    width:230px; flex-shrink:0;
    background:var(--card);
    border-right:1px solid var(--line);
    padding:28px 0;
    position:sticky; top:0; height:100vh; overflow-y:auto;
  }
  .rail-title{ font-family:'Source Serif 4', serif; font-weight:700; font-size:19px; padding:0 20px 6px; }
  .rail-sub{ font-size:12px; color:var(--ink-soft); padding:0 20px 18px; border-bottom:1px solid var(--line); margin-bottom:6px; }
  .chapter-label{
    font-size:11px; font-weight:700; letter-spacing:.03em; color:var(--ink-soft);
    padding:14px 20px 4px; text-transform:uppercase;
  }
  .unit-tab{
    display:block; width:100%; text-align:left; background:none; border:none;
    border-left:3px solid transparent; padding:12px 20px;
    font-family:'Noto Sans KR', sans-serif; font-size:14.5px; font-weight:500;
    color:var(--ink-soft); cursor:pointer;
  }
  .unit-tab .num{ display:inline-block; font-family:'Source Serif 4', serif; font-weight:600; font-size:12px; color:var(--ink-soft); margin-right:8px; }
  .unit-tab.active{ background:var(--pine-soft); border-left-color:var(--pine); color:var(--pine); }
  .unit-tab.active .num{ color:var(--pine); }
  .unit-tab:hover:not(.active){ background:#F0EADA; }
  .rail-progress{ padding:20px 20px 0; font-size:12px; color:var(--ink-soft); line-height:1.6; }

  /* ---- 메인 ---- */
  .main{ flex:1; min-width:0; padding:36px 44px 80px; max-width:860px; }
  .unit-header{ margin-bottom:26px; }
  .unit-header .eyebrow{ font-size:12.5px; color:var(--brick); font-weight:600; margin-bottom:4px; }
  .unit-header h1{ font-family:'Source Serif 4', serif; font-size:28px; font-weight:700; margin:0 0 6px; }
  .unit-header p{ margin:0; font-size:13.5px; color:var(--ink-soft); }

  .passage-chips{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:28px; }
  .chip{
    border:1px solid var(--line); background:var(--card); padding:8px 14px; border-radius:3px;
    font-size:13px; font-weight:500; color:var(--ink-soft); cursor:pointer; font-family:'Noto Sans KR', sans-serif;
  }
  .chip.active{ border-color:var(--brick); color:var(--brick); background:#FBEFEA; }

  .passage{ background:var(--card); border:1px solid var(--line); border-radius:4px; padding:6px 0 10px; }
  .passage-title{ display:flex; align-items:baseline; gap:10px; padding:20px 28px 16px; border-bottom:1px solid var(--line); flex-wrap:wrap; }
  .passage-title h2{ font-family:'Source Serif 4', serif; font-size:20px; font-weight:600; margin:0; }
  .passage-title .kor{ font-family:'Noto Serif KR', serif; font-size:13px; color:var(--ink-soft); }

  .passage-toolbar{ display:flex; justify-content:space-between; gap:8px; padding:12px 28px 0; flex-wrap:wrap; }
  .toolbar-right{ display:flex; gap:8px; }
  .toolbar-btn{
    font-family:'Noto Sans KR', sans-serif; font-size:12px; color:var(--pine); background:none;
    border:1px solid var(--pine); border-radius:20px; padding:5px 13px; cursor:pointer;
  }
  .toolbar-btn:hover{ background:var(--pine-soft); }
  .toolbar-btn.flow-btn{ color:var(--brick); border-color:var(--brick); }
  .toolbar-btn.flow-btn:hover{ background:#FBEFEA; }

  .flow-box{ display:none; margin:14px 28px 0; padding:14px 18px; background:var(--pine-soft); border:1px solid var(--pine); border-radius:4px; }
  .flow-box.show{ display:block; }
  .flow-box ol{ margin:0; padding-left:19px; }
  .flow-box li{ font-family:'Noto Serif KR', serif; font-size:13.5px; color:var(--ink); line-height:1.7; margin-bottom:5px; }
  .flow-box li:last-child{ margin-bottom:0; }
  .flow-empty{ font-family:'Noto Serif KR', serif; font-size:13px; color:var(--ink-soft); }

  .quiz-section{ margin:22px 28px 4px; padding:16px 18px; border:1px dashed var(--brick-soft); border-radius:4px; background:#FFFCF6; }
  .quiz-header{ font-family:'Source Serif 4', serif; font-weight:600; font-size:14px; color:var(--brick); margin-bottom:10px; }
  .quiz-types{ display:flex; flex-wrap:wrap; gap:8px; }
  .quiz-type-btn{ font-family:'Noto Sans KR', sans-serif; font-size:12.5px; color:var(--brick); background:#FBEFEA; border:1px solid var(--brick-soft); border-radius:16px; padding:6px 12px; cursor:pointer; }
  .quiz-type-btn:hover:not(:disabled){ background:#F6DCD1; }
  .quiz-type-btn:disabled{ opacity:.5; cursor:default; }
  .quiz-result{ margin-top:12px; }
  .quiz-loading, .quiz-empty{ font-family:'Noto Serif KR', serif; font-size:13px; color:var(--ink-soft); padding:6px 2px; }
  .quiz-instruction{ font-family:'Noto Serif KR', serif; font-size:14px; font-weight:600; color:var(--ink); margin-bottom:8px; }
  .quiz-passage{ font-family:'Source Serif 4', serif; font-size:14.5px; line-height:1.7; color:var(--ink); white-space:pre-wrap; background:var(--card); border:1px solid var(--line); border-radius:4px; padding:12px 14px; margin-bottom:12px; }
  .quiz-options{ display:flex; flex-direction:column; gap:8px; }
  .quiz-option{ text-align:left; font-family:'Noto Sans KR', sans-serif; font-size:13.5px; color:var(--ink); background:var(--card); border:1px solid var(--line); border-radius:4px; padding:9px 12px; cursor:pointer; white-space:pre-wrap; }
  .quiz-option:hover:not(:disabled){ background:#F0EADA; }
  .quiz-option:disabled{ cursor:default; }
  .quiz-option.correct{ border-color:var(--pine); background:var(--pine-soft); color:var(--pine); font-weight:600; }
  .quiz-option.wrong{ border-color:var(--brick); background:#FBEFEA; color:var(--brick); }
  .quiz-explanation{ margin-top:12px; font-family:'Noto Serif KR', serif; font-size:13px; color:var(--ink-soft); line-height:1.6; padding-top:10px; border-top:1px dashed var(--line); }
  .quiz-explanation strong{ color:var(--brick); }

  .sentence-list{ padding:14px 28px 10px; }
  .sentence{ padding:16px 0; border-bottom:1px dashed var(--line); }
  .sentence:last-child{ border-bottom:none; }
  .sentence-index{ font-family:'Source Serif 4', serif; font-size:12px; color:var(--brick-soft); margin-bottom:6px; }
  .en{ font-family:'Source Serif 4', serif; font-size:16.5px; line-height:1.6; color:var(--ink); margin-bottom:10px; }
  .en.strike{ text-decoration:line-through; color:var(--ink-soft); }
  .note-tag{
    display:inline-block; font-family:'Noto Sans KR', sans-serif; font-size:11px;
    color:var(--brick); border:1px solid var(--brick); border-radius:10px; padding:1px 8px; margin-left:8px; vertical-align:middle;
  }

  /* ---- 구절 단위 가림막 ---- */
  .ko-row{ display:flex; flex-wrap:wrap; align-items:center; gap:6px 0; line-height:2.05; }
  .phrase{ position:relative; display:inline-block; margin:2px 5px 2px 0; vertical-align:middle; }
  .ko-text{
    font-family:'Noto Serif KR', serif; font-size:14.5px; color:var(--ink-soft);
    visibility:hidden; white-space:pre; padding:2px 3px;
  }
  .cover{
    position:absolute; inset:0;
    background:repeating-linear-gradient(135deg, #EDE6D4, #EDE6D4 6px, #E2D8C0 6px, #E2D8C0 12px);
    border:1px solid var(--line); border-radius:3px; cursor:pointer;
  }
  .cover:hover{ background:repeating-linear-gradient(135deg, #E5DCC5, #E5DCC5 6px, #D9CCAC 6px, #D9CCAC 12px); }
  .phrase.revealed .ko-text{ visibility:visible; }
  .phrase.revealed .cover{ display:none; }
  .phrase:not(.revealed) .ko-text{ cursor:default; }
  .phrase.revealed .ko-text{ cursor:pointer; }

  .footnote{ padding:14px 28px 22px; font-size:12px; color:var(--ink-soft); font-family:'Noto Serif KR', serif; border-top:1px solid var(--line); margin-top:4px; }
  .footnote .hint{ color:var(--pine); }

  .table-wrap{ padding:16px 28px 0; overflow-x:auto; }
  table.ref-table{ border-collapse:collapse; width:100%; font-size:13px; font-family:'Noto Sans KR', sans-serif; }
  table.ref-table th, table.ref-table td{ border:1px solid var(--line); padding:7px 10px; text-align:center; }
  table.ref-table th{ background:#F0EADA; color:var(--ink); font-weight:600; }
  .table-caption{ font-size:12px; color:var(--ink-soft); padding:10px 28px 0; font-family:'Noto Serif KR', serif; }

  @media (max-width: 780px){
    .app{ flex-direction:column; }
    .rail{ width:100%; height:auto; position:relative; padding:14px 0; }
    .rail-title, .rail-sub, .rail-progress, .chapter-label{ padding-left:16px; padding-right:16px; }
    .unit-tab{ display:inline-block; width:auto; padding:9px 14px; }
    .main{ padding:24px 16px 60px; max-width:100%; }
    .passage-title, .sentence-list, .footnote, .table-wrap, .table-caption{ padding-left:18px; padding-right:18px; }
  }
</style>
</head>
<body>

<div class="app">
  <nav class="rail" id="rail">
    <div class="rail-title">올림포스 암기장</div>
    <div class="rail-sub">영어독해의 기본 2</div>
    <div id="unitTabs"></div>
    <div class="rail-progress" id="progressBox"></div>
  </nav>

  <main class="main">
    <div class="unit-header">
      <div class="eyebrow" id="unitEyebrow"></div>
      <h1 id="unitTitle"></h1>
      <p id="unitDesc"></p>
    </div>

    <div class="passage-chips" id="passageChips"></div>

    <section class="passage" id="passageView"></section>
  </main>
</div>

const unitKeys = Object.keys(DATA);
let currentUnit = unitKeys[0];
let currentPassageIdx = 0;

function renderRail(){
  const tabWrap = document.getElementById('unitTabs');
  tabWrap.innerHTML = '';
  let lastChapter = null;
  unitKeys.forEach((key) => {
    const unit = DATA[key];
    if (unit.chapter !== lastChapter){
      const label = document.createElement('div');
      label.className = 'chapter-label';
      label.textContent = typeof unit.chapter === 'number' ? `Chapter ${unit.chapter}` : unit.chapter;
      tabWrap.appendChild(label);
      lastChapter = unit.chapter;
    }
    const numMatch = unit.label.match(/\d+/);
    const num = numMatch ? numMatch[0] : '';
    const btn = document.createElement('button');
    btn.className = 'unit-tab' + (key === currentUnit ? ' active' : '');
    btn.innerHTML = `<span class="num">${num}</span>${unit.label}`;
    btn.onclick = () => { currentUnit = key; currentPassageIdx = 0; renderAll(); };
    tabWrap.appendChild(btn);
  });

  const unit = DATA[currentUnit];
  let total = 0;
  unit.passages.forEach(p => { total += p.sentences.filter(s => !s.skip).length; });
  document.getElementById('progressBox').innerHTML =
    `이 유닛 지문 ${unit.passages.length}개<br>총 문장 ${total}개`;
}

function renderHeader(){
  const unit = DATA[currentUnit];
  document.getElementById('unitEyebrow').textContent = typeof unit.chapter === 'number'
    ? `CHAPTER ${unit.chapter} · ${unit.label}`
    : `${unit.chapter} · ${unit.label}`;
  document.getElementById('unitTitle').textContent = unit.title;
  document.getElementById('unitDesc').textContent = unit.desc;
}

function renderChips(){
  const wrap = document.getElementById('passageChips');
  wrap.innerHTML = '';
  DATA[currentUnit].passages.forEach((p, i) => {
    const chip = document.createElement('button');
    chip.className = 'chip' + (i === currentPassageIdx ? ' active' : '');
    chip.textContent = `${i+1}. ${p.ko_title}`;
    chip.onclick = () => { currentPassageIdx = i; renderPassage(); renderChips(); };
    wrap.appendChild(chip);
  });
}

function escapeHtml(str){
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function renderTable(table){
  if (!table) return '';
  const headHtml = table.headers.map(h => `<th>${escapeHtml(h)}</th>`).join('');
  const rowsHtml = table.rows.map(r => `<tr>${r.map(c => `<td>${escapeHtml(c)}</td>`).join('')}</tr>`).join('');
  return `
    <div class="table-caption">${escapeHtml(table.caption)}</div>
    <div class="table-wrap">
      <table class="ref-table">
        <thead><tr>${headHtml}</tr></thead>
        <tbody>${rowsHtml}</tbody>
      </table>
    </div>
  `;
}

  const options = Array.isArray(data.options) ? data.options : [];
  const correct = Number(data.correctIndex);
  const optsHtml = options.map((opt, i) => `<button class="quiz-option" data-idx="${i}">${escapeHtml(String(opt))}</button>`).join('');
  box.innerHTML = `
    <div class="quiz-instruction">${escapeHtml(data.instruction || '')}</div>
    <div class="quiz-passage">${escapeHtml(data.displayText || '')}</div>
    <div class="quiz-options">${optsHtml}</div>
    <div class="quiz-explanation" id="quizExplanation" style="display:none;"></div>
  `;
  box.querySelectorAll('.quiz-option').forEach(optBtn => {
    optBtn.addEventListener('click', () => {
      const idx = Number(optBtn.dataset.idx);
      box.querySelectorAll('.quiz-option').forEach(b => b.disabled = true);
      if (idx === correct){
        optBtn.classList.add('correct');
      } else {
        optBtn.classList.add('wrong');
        const correctBtn = box.querySelector(`.quiz-option[data-idx="${correct}"]`);
        if (correctBtn) correctBtn.classList.add('correct');
      }
      const exp = document.getElementById('quizExplanation');
      exp.style.display = 'block';
      exp.innerHTML = `<strong>해설</strong> ${escapeHtml(data.explanation || '')}`;
    });
  });
}

async function generateQuiz(typeId, passage, view){
  const box = view.querySelector('#quizResult');
  const typeBtns = view.querySelectorAll('.quiz-type-btn');
  typeBtns.forEach(b => b.disabled = true);
  box.innerHTML = `<div class="quiz-loading">AI가 문제를 만들고 있어요...</div>`;
  try {
    const sample = await getSample();
    if (!sample){
      box.innerHTML = `<div class="quiz-empty">이 화면에서는 AI 문제 생성 기능을 사용할 수 없습니다.</div>`;
      return;
    }
    const passageText = passage.sentences.filter(s => !s.skip).map(s => s.en).join(' ');
    const prompt = buildQuizPrompt(typeId, passageText);
    const data = await sample.json(prompt, { modelTier: "default", cache: false });
    if (!data || !Array.isArray(data.options) || data.options.length === 0){
      box.innerHTML = `<div class="quiz-empty">문제 형식이 올바르지 않습니다. 다시 시도해 주세요.</div>`;
      return;
    }
    renderQuiz(data, box);
  } catch (e) {
    const code = (e && e.code) ? e.code : "error";
    box.innerHTML = `<div class="quiz-empty">문제를 만들지 못했습니다 (${escapeHtml(code)}). 버튼을 다시 눌러 시도해 주세요.</div>`;
  } finally {
    typeBtns.forEach(b => b.disabled = false);
  }
}

function renderPassage(){
  const p = DATA[currentUnit].passages[currentPassageIdx];
  const view = document.getElementById('passageView');

  const visibleSentences = p.sentences.filter(s => !s.skip);

  const sentencesHtml = visibleSentences.map((s, sIdx) => {
    const phrasesHtml = s.ko.map((phrase, pIdx) => `
      <span class="phrase" data-s="${sIdx}" data-p="${pIdx}">
        <span class="ko-text">${escapeHtml(phrase)}</span>
        <span class="cover"></span>
      </span>
    `).join('');
    const noteHtml = s.note ? `<span class="note-tag">${escapeHtml(s.note)}</span>` : '';
    return `
      <div class="sentence" data-idx="${sIdx}">
        <div class="sentence-index">${String(sIdx+1).padStart(2,'0')}</div>
        <div class="en${s.strike ? ' strike' : ''}">${s.en}${noteHtml}</div>
        <div class="ko-row">${phrasesHtml}</div>
      </div>
    `;
  }).join('');

  const flowHtml = (p.flow && p.flow.length)
    ? `<ol>${p.flow.map(f => `<li>${escapeHtml(f)}</li>`).join('')}</ol>`
    : `<div class="flow-empty">이 지문의 흐름 요약은 아직 준비되지 않았습니다.</div>`;

  view.innerHTML = `
    <div class="passage-title">
      <h2>${p.en_title}</h2>
      <span class="kor">${p.ko_title}</span>
    </div>
    ${renderTable(p.table)}
    <div class="passage-toolbar">
      <button class="toolbar-btn flow-btn" id="flowBtn">🔎 흐름 보기</button>
      <div class="toolbar-right">
        <button class="toolbar-btn" id="revealAllBtn">전체 구절 보기</button>
        <button class="toolbar-btn" id="hideAllBtn">전체 가리기</button>
      </div>
    </div>
    <div class="flow-box" id="flowBox">${flowHtml}</div>
    <div class="sentence-list">${sentencesHtml}</div>
    <div class="footnote"><span class="hint">가림막</span>을 구절 단위로 하나씩 눌러보며 스스로 해석해보고, 확인하고 싶은 부분만 열어보세요.</div>
    <div class="quiz-section">
      <div class="quiz-header">🧩 AI 문제 만들기</div>
      <div class="quiz-types">
        ${QUIZ_TYPES.map(t => `<button class="quiz-type-btn" data-type="${t.id}">${t.label}</button>`).join('')}
      </div>
      <div class="quiz-result" id="quizResult"></div>
    </div>
  `;

  view.querySelectorAll('.phrase').forEach(el => {
    const cover = el.querySelector('.cover');
    const text = el.querySelector('.ko-text');
    cover.addEventListener('click', () => el.classList.add('revealed'));
    text.addEventListener('click', () => el.classList.remove('revealed'));
  });
  document.getElementById('revealAllBtn').onclick = () => {
    view.querySelectorAll('.phrase').forEach(el => el.classList.add('revealed'));
  };
  document.getElementById('hideAllBtn').onclick = () => {
    view.querySelectorAll('.phrase').forEach(el => el.classList.remove('revealed'));
  };
  document.getElementById('flowBtn').onclick = () => {
    const box = document.getElementById('flowBox');
    const btn = document.getElementById('flowBtn');
    box.classList.toggle('show');
    btn.textContent = box.classList.contains('show') ? '🔎 흐름 숨기기' : '🔎 흐름 보기';
  };
  view.querySelectorAll('.quiz-type-btn').forEach(btn => {
    btn.addEventListener('click', () => generateQuiz(btn.dataset.type, p, view));
  });
}

function renderAll(){
  renderRail();
  renderHeader();
  renderChips();
  renderPassage();
}

renderAll();
</script>
